[package]
name = "file-manager"
version = "0.2.1"
description = "本地智能文件归档客户端"
edition = "2021"
rust-version = "1.77"

[features]
# 用于生产构建（不带 devServer 时走自定义协议），勿删
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
rfd = "0.15"
flate2 = "1"
base64 = "0.22"
percent-encoding = "2"
# 本地大模型调用（绕开 WebView 的 CORS 限制，见 main.rs 的 llm_request）
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
