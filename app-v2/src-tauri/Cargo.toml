[package]
name = "filemanager-v2"
version = "0.6.0-alpha.1"
description = "本地智能文件归档客户端 v2"
edition = "2021"
rust-version = "1.77"

[features]
# 用于生产构建（不带 devServer 时走自定义协议），勿删
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：整理台的图片缩略图直接走本地文件协议，不在后端解码
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
rfd = "0.15"
base64 = "0.22"
percent-encoding = "2"
# 整理台的正文预览：docx/xlsx/pptx 都是 zip 包，读 word/document.xml 那一份就够
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
regex = "1"
# 目录名超长截断的哈希后缀（详设 §7.3 第 4 条）
md5 = "0.7"
# 本地大模型调用（绕开 WebView 的 CORS 限制，见 llm.rs）
ureq = { version = "2", default-features = false, features = ["tls"] }
# SQLite：bundled 编静态库，不依赖本机 dll
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
pdf-extract = "0.7"
notify = "6"
# 路径规范化（去 `..`、不带 \\?\ 前缀）：Windows.Data.Pdf 的 GetFileFromPathAsync 挑路径
dunce = "1"

[dev-dependencies]
tempfile = "3"

# 查磁盘剩余空间走内核 API：GUI 进程起控制台子进程会闪黑框（见 main.rs free_gb）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
# 扫描件 PDF 栅格化（P4 M2）：Windows.Data.Pdf 是系统自带渲染器，
# 纯编译免 DLL 分发（pdfium 要 +8MB 原生依赖 + 管 DLL，弃）
windows = { version = "0.58", features = [
    "Foundation",
    "Data_Pdf",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
